name: Sri Lanka Job & Gazette Scraper

on:
  schedule:
    # SLT: 07:30 AM & 11:30 AM (UTC: 02:00 AM & 06:00 AM)
    - cron: '0 2 * * *'    # 07:30 AM (උදෑසන 07:30)
    - cron: '0 6 * * *'    # 11:30 AM (උදෑසන 11:30)
    
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GEMINI_SCRAPER_KEY: ${{ secrets.GEMINI_SCRAPER_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_SCRAPER_KEY }}
        run: python scraper.py
