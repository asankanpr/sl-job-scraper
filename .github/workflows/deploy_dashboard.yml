name: Deploy Admin Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Supabase Secrets into index.html
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python -c "
          import os
          url = os.environ.get('SB_URL', '').strip()
          key = os.environ.get('SB_KEY', '').strip()
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.replace('__SUPABASE_URL__', url).replace('__SUPABASE_ANON_KEY__', key)
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
